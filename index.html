<!-- 游戏源码（JSX）按顺序加载、合并后一次性编译，保证依赖顺序 -->
<script type="text/javascript">
(function () {
    var files = [
        "./src/ui/common.js",
        "./src/ui/menu/register.js",
        "./src/ui/menu/boxTransfer.js",
        "./src/ui/menu/upgradePlace.js",
        "./src/ui/menu/stateBar.js",
        "./src/ui/menu/bag/equipBar.js",
        "./src/ui/menu/bag/statPanel.js",
        "./src/ui/menu/bag/ownedList.js",
        "./src/ui/menu/bag/itemDetail.js",
        "./src/ui/menu/bag/panel.js",
        "./src/ui/menu/skillPanel.js",
        "./src/ui/menu/settingsPanel.js",
        "./src/ui/menu/normalMenu.js",
        "./src/ui/menu/index.js",
        "./src/systems/studio.js",
        "./src/systems/events.js",
        "./src/scenes/home.js",
        "./src/scenes/battle.js",
        "./src/scenes/dungeon.js",
        "./src/scenes/advan.js",
        "./src/core/MainComponent.js",
        "./src/main.js"
    ];
    var boot = document.getElementById('boot-status');
    // 更新可见加载状态；isError 为真时用错误样式并保留提示（不自动移除）
    function setBoot(text, isError) {
        if (!boot) return;
        boot.textContent = text;
        if (isError) {
            boot.style.background = '#fbeaea';
            boot.style.color = '#8a2b22';
        }
    }
    function hideBoot() {
        if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        boot = null;
    }
    var acc = "";
    function load(i) {
        if (i >= files.length) {
            setBoot('资源已加载，正在用 Babel 编译游戏脚本……');
            try {
                var B = window.babel || window.Babel;
                if (!B) throw new Error('Babel 未加载（build/browser.min.js 加载失败）');
                var compiled = B.transform(acc, {}).code;
                (0, eval)(compiled);
                hideBoot();
            } catch (e) {
                setBoot('游戏启动失败：' + (e && e.message ? e.message : e) +
                    '\n\n请打开浏览器控制台查看详细堆栈，刷新页面可重试。', true);
                console.error("[game] 编译/执行失败：", e);
            }
            return;
        }
        setBoot('正在加载游戏资源：' + (i + 1) + ' / ' + files.length + '\n' + files[i]);
        fetch(files[i]).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
        }).then(function (t) {
            acc += "\n" + t + "\n";
            load(i + 1);
        }).catch(function (e) {
            setBoot('资源加载失败：' + files[i] + '\n' + (e && e.message ? e.message : e) +
                '\n\n请确认 python3 dev_server.py 正在运行，刷新页面可重试。', true);
            console.error("[game] 加载失败：", files[i], e);
        });
    }
    load(0);
})();
</script>

</body>
