<!-- 游戏源码（JSX）按顺序加载、合并后一次性编译，保证依赖顺序 -->
<script type="text/javascript">
(function () {
    var files = [
        "./src/ui/common.js",
        "./src/ui/menu/register.js",
        "./src/ui/menu/boxTransfer.js",
        "./src/ui/menu/upgradePlace.js",
        "./src/ui/menu/stateBar.js",
        "./src/ui/menu/bag/equipBar.js",
        "./src/ui/menu/bag/statPanel.js",
        "./src/ui/menu/bag/ownedList.js",
        "./src/ui/menu/bag/itemDetail.js",
        "./src/ui/menu/bag/panel.js",
        "./src/ui/menu/skillPanel.js",
        "./src/ui/menu/settingsPanel.js",
        "./src/ui/menu/normalMenu.js",
        "./src/ui/menu/index.js",
        "./src/systems/studio.js",
        "./src/systems/events.js",
        "./src/scenes/home.js",
        "./src/scenes/battle.js",
        "./src/scenes/dungeon.js",
        "./src/scenes/advan.js",
        "./src/core/MainComponent.js",
        "./src/main.js"
    ];
    var acc = "";
    function load(i) {
        if (i >= files.length) {
            try {
                var B = window.babel || window.Babel;
                var compiled = B.transform(acc, {}).code;
                (0, eval)(compiled);
            } catch (e) {
                console.error("[game] 编译/执行失败：", e);
            }
            return;
        }
        fetch(files[i]).then(function (r) {
            return r.text();
        }).then(function (t) {
            acc += "\n" + t + "\n";
            load(i + 1);
        }).catch(function (e) {
            console.error("[game] 加载失败：", files[i], e);
        });
    }
    load(0);
})();
</script>
